<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

<body>
    <!-- Header & Navigation -->
    <header>
        <h1>🪡Hookers🪡</h1>

            <ul>
                <li><a href="index.html">Home</a></li>

    <main>
    
<!-- Contact Form -->
<section id="contact" class="contact-form" aria-labelledby="contact-heading">
  <h2 id="contact-heading">Questions or Requests?</h2>
  <p>If you have something you want, let me know! We can talk about it!</p>
  <form action="#" method="post">
    <div class="form-grid">
      <div class="row-pair">
        <div class="form-row">
            
          <label for="name">Name:</label>
          <input id="name" name="name" type="text" required aria-required="true">
        </div>

        <div class="form-row">
          <label for="email">Email:</label>
          <input id="email" name="email" type="email" required aria-required="true">
        </div>
      </div>

      <div class="form-row">
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="7" required aria-required="true"></textarea>
      </div>

      <div class="submit-row">
        <button type="submit">Send Message</button>
      </div>

    </div>
  </form>
</section>
</main>
    <!-- Footer -->
    <footer>
        <!-- <p>&copy; 2025 Campus Coffee Co.</p> -->
        <div class="social-links">
            <a href="#" aria-label="Facebook">FB</a>
            <a href="#" aria-label="Instagram">IG</a>
            <a href="#" aria-label="Twitter">TW</a>
        </div>
    </footer>
</body>
</html>
